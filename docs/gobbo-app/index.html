<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Gobbo · Parlane con Corinne Cléry</title>
<style>
  :root {
    --bg: #000000;
    --text: #f5f2ea;
    --dim: #6b675c;
    --accent: #c9a15a;
    --line: rgba(201,161,90,0.55);
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; background:var(--bg); overflow:hidden; font-family: Georgia, 'Times New Roman', serif; }

  /* ============ SCHERMATA SCELTA ============ */
  #menu {
    position:fixed; inset:0; z-index:30;
    overflow-y:auto;
    padding: 8vh 6vw calc(6vh + env(safe-area-inset-bottom,0px)) 6vw;
    background:var(--bg);
  }
  #menu h1 {
    color:var(--accent);
    font-size: 15px;
    letter-spacing:0.35em;
    text-transform:uppercase;
    text-align:center;
    font-weight:normal;
    margin-bottom: 6vh;
  }
  #menu h1 span { display:block; color:var(--dim); font-size:11px; letter-spacing:0.2em; margin-top:8px; }
  .gobbo-item {
    display:block; width:100%;
    background:#111; border:1px solid #2a2a2a; border-radius:14px;
    color:var(--text);
    font-family: Georgia, serif;
    font-size: 20px;
    text-align:left;
    padding: 20px 22px;
    margin-bottom: 14px;
    cursor:pointer;
  }
  .gobbo-item:active { border-color:var(--accent); }
  .gobbo-item .nuova { display:inline-block; background:var(--accent); color:#000; font-family:-apple-system,'Segoe UI',Roboto,sans-serif; font-size:11px; font-weight:700; letter-spacing:0.1em; border-radius:6px; padding:3px 7px; margin-right:10px; vertical-align:middle; }
  .gobbo-item small { display:block; color:var(--dim); font-size:12px; font-family:-apple-system,'Segoe UI',Roboto,sans-serif; margin-top:6px; letter-spacing:0.05em; }
  .archivio-btn { display:block; text-decoration:none; text-align:center; background:var(--accent); color:#111; border-radius:14px; padding:16px 20px; margin:0 0 5vh; font-family:-apple-system,'Segoe UI',Roboto,sans-serif; font-weight:700; font-size:18px; }
  .archivio-btn small { display:block; font-weight:400; font-size:12px; margin-top:4px; opacity:.75; }
  .gobbo-section { color:var(--accent); font-family:-apple-system,'Segoe UI',Roboto,sans-serif; font-weight:600; font-size:13px; letter-spacing:0.3em; text-transform:uppercase; margin:5vh 0 14px; padding-bottom:8px; border-bottom:1px solid #2a2a2a; }
  .gobbo-section:first-child { margin-top:0; }
  #menuStatus { color:var(--dim); text-align:center; font-size:14px; font-family:-apple-system,sans-serif; line-height:1.6; padding:20px; }
  #menuStatus code { color:var(--accent); }

  /* ============ PLAYER ============ */
  #player { display:none; }
  body.inplayer #player { display:block; }
  body.inplayer #menu { display:none; }

  #stage { position:fixed; inset:0; overflow:hidden; cursor:pointer; }
  #scroller {
    position:absolute; left:0; right:0; top:0;
    padding: 45vh 6vw 60vh 6vw;
    will-change: transform;
    text-align:center;
  }
  #scroller p {
    color:var(--text);
    font-size: var(--fs, 42px);
    line-height: 1.5;
    margin-bottom: 1.1em;
    font-weight: 400;
    letter-spacing: 0.01em;
  }
  #scroller p strong { color:var(--accent); font-weight:600; }
  #scroller p.cue {
    color:var(--dim); font-style:italic;
    font-size: calc(var(--fs, 42px) * 0.62);
    letter-spacing:0.08em;
  }
  #scroller p.title {
    color:var(--accent);
    font-size: calc(var(--fs, 42px) * 0.55);
    letter-spacing:0.35em; text-transform:uppercase;
    margin-bottom:2.5em;
  }
  #scroller p.end {
    color:var(--dim);
    font-size: calc(var(--fs, 42px) * 0.55);
    letter-spacing:0.3em; text-transform:uppercase;
    margin-top:3em;
  }

  #readline {
    position:fixed; left:0; right:0; top:42vh; height:0;
    border-top:1px solid var(--line);
    pointer-events:none; z-index:5;
  }
  #readline::before, #readline::after { content:''; position:absolute; top:-7px; border:7px solid transparent; }
  #readline::before { left:8px;  border-left-color:var(--accent); }
  #readline::after  { right:8px; border-right-color:var(--accent); }

  #fadeTop, #fadeBottom { position:fixed; left:0; right:0; pointer-events:none; z-index:4; }
  #fadeTop    { top:0;    height:20vh; background:linear-gradient(to bottom, rgba(0,0,0,0.92), transparent); }
  #fadeBottom { bottom:0; height:24vh; background:linear-gradient(to top,    rgba(0,0,0,0.92), transparent); }

  body.mirrored #stage { transform: scaleX(-1); }

  #countdown {
    position:fixed; inset:0; z-index:20; display:none;
    align-items:center; justify-content:center;
    background:rgba(0,0,0,0.85);
    color:var(--accent); font-size:28vh; font-weight:bold;
  }

  #controls {
    position:fixed; left:0; right:0; bottom:0; z-index:10;
    display:flex; align-items:center; justify-content:center; gap:10px;
    padding: 12px 14px calc(12px + env(safe-area-inset-bottom,0px)) 14px;
    background: rgba(10,10,10,0.9);
    backdrop-filter: blur(6px);
    border-top:1px solid #222;
    font-family:-apple-system,'Segoe UI',Roboto,sans-serif;
    transition: opacity 0.4s, transform 0.4s;
    flex-wrap:wrap;
  }
  body.playing #controls { opacity:0; transform:translateY(100%); pointer-events:none; }
  #controls button {
    background:#1a1a1a; color:var(--text);
    border:1px solid #333; border-radius:10px;
    min-width:52px; height:52px;
    font-size:15px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:2px; padding:0 10px;
  }
  #controls button small { font-size:10px; color:var(--dim); }
  #controls button.primary { background:var(--accent); color:#000; border-color:var(--accent); font-weight:bold; min-width:90px; font-size:16px; }
  #controls button.active { border-color:var(--accent); color:var(--accent); }
  #speedVal, #fsVal { color:var(--accent); font-size:13px; min-width:44px; text-align:center; }

  #hint {
    position:fixed; top:calc(10px + env(safe-area-inset-top,0px)); left:0; right:0;
    text-align:center; z-index:10;
    color:var(--dim); font-size:12px;
    font-family:-apple-system,'Segoe UI',Roboto,sans-serif;
    letter-spacing:0.05em; transition:opacity 0.4s; pointer-events:none;
  }
  body.playing #hint { opacity:0.6; }
</style>
</head>
<body>

<!-- ======== SCELTA GOBBO ======== -->
<div id="menu">
  <h1>Parlane con Corinne Cléry<span>scegli il gobbo</span></h1>
  <a class="archivio-btn" href="archivio/">📚 Archivio delle storie<small>situazione, cronologia, PDF da scaricare</small></a>
  <div id="gobboList"></div>
  <div id="menuStatus">Carico l'elenco…</div>
</div>

<!-- ======== PLAYER ======== -->
<div id="player">
  <div id="hint">Tocca lo schermo per avviare / fermare · le frecce ◄ ► indicano la riga da leggere</div>
  <div id="stage">
    <div id="scroller"></div>
    <div id="readline"></div>
    <div id="fadeTop"></div>
    <div id="fadeBottom"></div>
  </div>
  <div id="countdown"></div>
  <div id="controls">
    <button id="btnMenu" title="Torna alla scelta">☰<small>gobbi</small></button>
    <button id="btnRestart" title="Ricomincia">⟲<small>inizio</small></button>
    <button id="btnSlower">−<small>lento</small></button>
    <span id="speedVal">1.0×</span>
    <button id="btnFaster">+<small>veloce</small></button>
    <button id="btnPlay" class="primary">▶ Avvia</button>
    <button id="btnSmaller">A−<small>testo</small></button>
    <span id="fsVal">42</span>
    <button id="btnBigger">A+<small>testo</small></button>
    <button id="btnMirror" title="Modalità specchio">⇋<small>specchio</small></button>
  </div>
</div>

<script>
(function(){
  const GOBBI_DIR = 'gobbi/';
  const listEl   = document.getElementById('gobboList');
  const statusEl = document.getElementById('menuStatus');
  const scroller = document.getElementById('scroller');
  const stage    = document.getElementById('stage');
  const cdEl     = document.getElementById('countdown');
  const btnPlay  = document.getElementById('btnPlay');

  /* ---------- elenco gobbi ---------- */
  function prettify(name){
    return name.replace(/\.txt$/i,'').replace(/[-_]+/g,' ')
               .replace(/\b\w/g, c => c.toUpperCase());
  }

  async function loadList(){
    let files = [];   // [{name, mod}]
    // 1° tentativo: listing JSON di Caddy (con data di modifica)
    try {
      const r = await fetch(GOBBI_DIR + '?t=' + Date.now(), { cache: 'no-store', headers: { 'Accept': 'application/json' } });
      if(r.ok){
        const ct = r.headers.get('content-type') || '';
        if(ct.includes('json')){
          const data = await r.json();
          const arr = Array.isArray(data) ? data : (data.files || []);
          files = arr.filter(f => !f.is_dir && /\.txt$/i.test(f.name))
                     .map(f => ({ name: f.name, mod: Date.parse(f.mod_time) || 0 }));
        } else {
          // 2° tentativo: parso l'HTML del browse
          const html = await r.text();
          const doc = new DOMParser().parseFromString(html, 'text/html');
          const names = Array.from(doc.querySelectorAll('a[href]'))
            .map(a => decodeURIComponent(a.getAttribute('href')))
            .map(h => h.split('/').pop())
            .filter(n => /\.txt$/i.test(n));
          files = Array.from(new Set(names)).map(n => ({ name: n, mod: 0 }));
        }
      }
    } catch(e){ /* gestito sotto */ }

    if(files.length === 0){
      statusEl.innerHTML = 'Nessun gobbo trovato.<br><br>Carica un file <code>.txt</code> nella cartella <code>gobbi/</code> del server e ricarica questa pagina.<br><br>Se la cartella esiste già, verifica che nel blocco Caddy ci sia <code>browse</code> dentro <code>file_server</code>.';
      return;
    }
    statusEl.style.display = 'none';
    // i più recenti in cima; a parità di data, ordine alfabetico
    files.sort((a, b) => (b.mod - a.mod) || a.name.localeCompare(b.name));
    // due sezioni: i racconti noir (file storia-* / racconto-*) e tutto il resto (interviste, salotto)
    const isRacconto = f => /^(storia|racconto)[-_]/i.test(f.name);
    const sezioni = [
      ['Racconti · i più recenti in alto', files.filter(isRacconto)],
      ['Interviste', files.filter(f => !isRacconto(f))]
    ];
    const NUOVA_MS = 3 * 24 * 3600 * 1000;
    sezioni.forEach(([titolo, elenco]) => {
      if(!elenco.length) return;
      const h = document.createElement('h2');
      h.className = 'gobbo-section';
      h.textContent = titolo;
      listEl.appendChild(h);
      elenco.forEach(f => {
        const btn = document.createElement('button');
        btn.className = 'gobbo-item';
        const nuova = f.mod && (Date.now() - f.mod) < NUOVA_MS;
        const label = document.createElement('span');
        label.textContent = prettify(f.name);
        const small = document.createElement('small');
        small.textContent = f.name;
        if(nuova){
          const b = document.createElement('b');
          b.className = 'nuova';
          b.textContent = 'NUOVA';
          btn.appendChild(b);
        }
        btn.appendChild(label);
        btn.appendChild(small);
        btn.addEventListener('click', () => openGobbo(f.name));
        listEl.appendChild(btn);
        // titolo vero dalla prima riga «# Titolo» del file
        fetch(GOBBI_DIR + encodeURIComponent(f.name), { cache: 'no-store' })
          .then(r => r.ok ? r.text() : '')
          .then(t => { const m = /^#\s*(.+)$/m.exec(t || ''); if(m) label.textContent = m[1].trim(); })
          .catch(() => {});
      });
    });
  }

  /* ---------- parser testo → gobbo ----------
     Formato dei .txt:
       # Titolo               → intestazione dorata
       (respiro · pausa)      → indicazione di regia (non si legge)
       riga vuota             → nuovo paragrafo
       *parola*               → parola evidenziata in oro
  ------------------------------------------- */
  function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function renderText(raw){
    scroller.innerHTML = '';
    const blocks = raw.replace(/\r\n/g,'\n').split(/\n\s*\n/);
    blocks.forEach(b => {
      const t = b.trim();
      if(!t) return;
      const p = document.createElement('p');
      if(t.startsWith('#')){
        p.className = 'title';
        p.textContent = t.replace(/^#+\s*/,'');
      } else if(/^\(.*\)$/s.test(t)){
        p.className = 'cue';
        p.textContent = t;
      } else {
        p.innerHTML = esc(t).replace(/\*([^*\n]+)\*/g, '<strong>$1</strong>');
      }
      scroller.appendChild(p);
    });
    const end = document.createElement('p');
    end.className = 'end';
    end.textContent = '— fine —';
    scroller.appendChild(end);
  }

  async function openGobbo(name){
    try {
      const r = await fetch(GOBBI_DIR + encodeURIComponent(name), { cache: 'no-store' });
      if(!r.ok) throw new Error(r.status);
      renderText(await r.text());
      stop(); y = 0; render();
      document.body.classList.add('inplayer');
    } catch(e){
      alert('Impossibile caricare "' + name + '" (' + e.message + ')');
    }
  }

  /* ---------- motore di scorrimento ---------- */
  let playing = false, y = 0, speedFactor = 1.0, fontSize = 42;
  const BASE_PXPS = 55;
  let rafId = null, lastT = null, countdownTimer = null;

  function applyFont(){ scroller.style.setProperty('--fs', fontSize+'px'); document.getElementById('fsVal').textContent = fontSize; }
  function applySpeedLabel(){ document.getElementById('speedVal').textContent = speedFactor.toFixed(1)+'×'; }
  function render(){ scroller.style.transform = 'translateY(' + (-y) + 'px)'; }
  function maxScroll(){ return Math.max(0, scroller.offsetHeight - window.innerHeight*0.42); }

  function tick(t){
    if(!playing) return;
    if(lastT === null) lastT = t;
    const dt = (t - lastT)/1000; lastT = t;
    y += BASE_PXPS * speedFactor * dt;
    if(y >= maxScroll()){ y = maxScroll(); stop(); }
    render();
    rafId = requestAnimationFrame(tick);
  }
  function start(withCountdown){
    if(playing) return;
    if(withCountdown){
      let n = 3;
      cdEl.style.display='flex'; cdEl.textContent = n;
      countdownTimer = setInterval(function(){
        n--;
        if(n<=0){ clearInterval(countdownTimer); countdownTimer=null; cdEl.style.display='none'; reallyStart(); }
        else cdEl.textContent = n;
      }, 800);
    } else reallyStart();
  }
  function reallyStart(){
    playing = true; lastT = null;
    document.body.classList.add('playing');
    btnPlay.textContent = '❚❚ Pausa';
    rafId = requestAnimationFrame(tick);
  }
  function stop(){
    playing = false;
    if(rafId) cancelAnimationFrame(rafId);
    if(countdownTimer){ clearInterval(countdownTimer); countdownTimer=null; cdEl.style.display='none'; }
    document.body.classList.remove('playing');
    btnPlay.textContent = '▶ Avvia';
  }
  function toggle(){
    if(countdownTimer){ clearInterval(countdownTimer); countdownTimer=null; cdEl.style.display='none'; return; }
    if(playing) stop(); else start(y < 5);
  }

  /* ---------- eventi player ---------- */
  stage.addEventListener('click', toggle);
  cdEl.addEventListener('click', toggle);
  btnPlay.addEventListener('click', e => { e.stopPropagation(); toggle(); });
  document.getElementById('btnMenu').addEventListener('click', e => {
    e.stopPropagation(); stop(); document.body.classList.remove('inplayer');
  });
  document.getElementById('btnRestart').addEventListener('click', e => { e.stopPropagation(); stop(); y=0; render(); });
  document.getElementById('btnSlower').addEventListener('click', e => { e.stopPropagation(); speedFactor = Math.max(0.3, Math.round((speedFactor-0.1)*10)/10); applySpeedLabel(); });
  document.getElementById('btnFaster').addEventListener('click', e => { e.stopPropagation(); speedFactor = Math.min(3.0, Math.round((speedFactor+0.1)*10)/10); applySpeedLabel(); });
  document.getElementById('btnSmaller').addEventListener('click', e => { e.stopPropagation(); fontSize = Math.max(22, fontSize-2); applyFont(); });
  document.getElementById('btnBigger').addEventListener('click', e => { e.stopPropagation(); fontSize = Math.min(90, fontSize+2); applyFont(); });
  document.getElementById('btnMirror').addEventListener('click', e => {
    e.stopPropagation();
    document.body.classList.toggle('mirrored');
    e.currentTarget.classList.toggle('active');
  });

  document.addEventListener('keydown', function(e){
    if(!document.body.classList.contains('inplayer')) return;
    if(e.code === 'Space'){ e.preventDefault(); toggle(); }
    else if(e.code === 'ArrowUp'){ speedFactor = Math.min(3.0, speedFactor+0.1); applySpeedLabel(); }
    else if(e.code === 'ArrowDown'){ speedFactor = Math.max(0.3, speedFactor-0.1); applySpeedLabel(); }
    else if(e.code === 'Home'){ stop(); y=0; render(); }
    else if(e.code === 'Escape'){ stop(); document.body.classList.remove('inplayer'); }
  });

  let touchStartY = null;
  stage.addEventListener('touchstart', e => { touchStartY = e.touches[0].clientY; }, {passive:true});
  stage.addEventListener('touchmove', e => {
    if(touchStartY === null) return;
    const dy = touchStartY - e.touches[0].clientY;
    touchStartY = e.touches[0].clientY;
    y = Math.min(maxScroll(), Math.max(0, y + dy));
    render();
  }, {passive:true});
  stage.addEventListener('wheel', e => {
    y = Math.min(maxScroll(), Math.max(0, y + e.deltaY*0.5));
    render();
  }, {passive:true});

  applyFont(); applySpeedLabel();
  loadList();
})();
</script>
</body>
</html>
